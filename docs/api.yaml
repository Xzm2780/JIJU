  /posts/{post_id}/reaction:
    put:
      tags:
        - Reactions
      operationId: setReaction
      summary: 提交或切换轻互动
      description: |
        鉴权要求：必须登录；运营账号按普通账号规则处理。
        请求参数与校验：type 仅允许 HUG、HEAD_PAT、CHEER；帖子必须有效公开；首次互动前须确认使用须知。
        响应结构：返回当前用户选择、三种互动数量和总数。
        错误码：引用 docs/errors.md；区分未登录、登录失效、内容不可用、内容状态不允许、状态冲突和系统错误。
        幂等要求：必须携带 Idempotency-Key，值为 v1:reaction.set:<uuid_v7>；同一选择意图重试复用同一键。
        副作用：同一 (user_id, post_id) 只保留一条记录；首次选择新类型加一，切换时旧类型减一、新类型加一；不消耗发布或评论配额。
        浏览量：不返回 view_count。
      x-auth:
        authentication: user
        roles: [AUTH_NON_AUTHOR, AUTHOR]
        ordinary_account_only: true
      x-validation:
        - post must be effective and publicly available
        - reaction type must be HUG, HEAD_PAT or CHEER
        - current notice version must be confirmed
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4032
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_CONFLICT_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: reaction.set
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries that set the same reaction type
      x-side-effects:
        - create or update the single Reaction for user_id and post_id
        - when switching, decrement old type and increment new type atomically
        - keep total reaction count unchanged during a switch
        - do not consume posting or comment quota
      x-view-count:
        returned: false
        rule: reaction response must never serialize view_count
      security:
        - bearerAuth: []
