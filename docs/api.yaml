openapi: 3.0.3
info:
  title: JIJU MVP API
  version: 1.1.0
  description: |
    JIJU 微信小程序 MVP 接口契约。

    依据：
    - 根目录 domain.md；当前仓库不存在 docs/domain.md。
    - docs/state-machine.md
    - docs/permissions.md
    - docs/errors.md

    通用约定：
    - 服务端校验是唯一授权依据，客户端角色声明一律不可信。
    - 时间字段使用 RFC 3339 UTC，以 Z 结尾；业务自然日由服务端按北京时间计算。
    - 错误响应与错误码引用 docs/errors.md。所有接口都可能出现客户端本地 NETWORK_ERROR。
    - 只有 GET /posts/{post_id} 在调用者是作者时返回 view_count；其他接口不得返回浏览量。
    - Unicode 扩展字素簇限制无法由 OpenAPI maxLength 精确表达，服务端仍须按扩展字素簇校验。
    - 运营后台使用独立 adminBearerAuth；后台登录不在本次 MVP 接口范围内。
servers:
  - url: /api/v1
    description: MVP API 根路径
tags:
  - name: Auth
    description: 微信登录与会话注销
  - name: Feed
    description: 广场信息流
  - name: Posts
    description: 帖子读取、发布、编辑和删除
  - name: Comments
    description: 评论列表、提交和删除
  - name: Reactions
    description: 固定轻互动提交、切换和取消
  - name: Me
    description: 当前用户的帖子
  - name: Reports
    description: 用户举报
  - name: Notices
    description: 使用须知确认
  - name: Admin
    description: 独立运营后台接口
paths:
  /feed:
    get:
      tags:
        - Feed
      operationId: listFeed
      summary: 获取广场信息流
      description: |
        鉴权要求：无需登录；游客、登录非作者、作者和运营均可按普通用户规则浏览。
        请求参数与校验：cursor 为服务端签发的不可解释游标；limit 为 1 至 50，默认 20；仅返回有效公开帖子。
        响应结构：按 published_at 倒序的游标分页，包含作者广场昵称、标签、正文摘要、评论数和三类轻互动数量。
        错误码：参考 docs/errors.md；预期仅有系统暂时不可用和客户端网络失败。
        幂等要求：GET 只读，不需要 Idempotency-Key。
        副作用：不创建 ViewRecord、不改变评论或互动计数、不消耗配额。
        浏览量：不返回 view_count。
      x-auth:
        authentication: none
        roles: [GUEST, AUTH_NON_AUTHOR, AUTHOR, OPERATOR]
      x-validation:
        - cursor must be an opaque server-issued token when present
        - limit must be an integer between 1 and 50
        - only PUBLISHED posts with publicly allowed moderation state, not expired, hidden or deleted
      x-errors:
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: false
        header: null
        rule: read-only request
      x-side-effects:
        - none
      x-view-count:
        returned: false
        rule: feed responses must never serialize view_count
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 广场游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /posts:
    post:
      tags:
        - Posts
      operationId: publishPost
      summary: 发布帖子
      description: |
        鉴权要求：必须使用普通用户登录态；运营账号在普通前台不得使用后台权限绕过。
        请求参数与校验：正文去首尾空白后为 1 至 500 个 Unicode 扩展字素簇；情绪标签和情境标签各最多一个，必须来自 GET /tags 返回的对应分类启用 Tag ID；retention_hours 必须显式传 24、72、168，客户端默认预选 168，服务端不隐式默认；首次表达前须确认当前使用须知。
        响应结构：返回帖子 ID、内容版本、公开状态、审核状态、发布时间和固定到期时间。
        错误码：未登录、登录失效、须知未确认、内容校验失败、发帖配额满、状态冲突、服务不可用或网络失败，引用 docs/errors.md。
        幂等要求：必须携带 Idempotency-Key，值为 v1:post.publish:<uuid_v7>；同一发布意图重试复用同一键。
        副作用：创建 Post 与首个内容版本；成功消耗一条发帖配额；正常通过为 PASSED，高风险确认后为 PENDING 并进入复核；不返回浏览量。
        浏览量：不返回 view_count。
      x-auth:
        authentication: user
        roles: [AUTH_NON_AUTHOR, AUTHOR]
        ordinary_account_only: true
      x-validation:
        - body_text trimmed length is 1 to 500 Unicode extended grapheme clusters
        - at most one emotion_tag_id and one context_tag_id
        - tag ids must be active and belong to their declared category
        - retention_hours is required and must be one of 24, 72, 168
        - current notice version must be confirmed
        - when the rule result is CONFIRM, the first request returns JIJU_MODERATION_4092 without creating a post
        - the confirmation retry must include the server-issued risk_challenge_id and risk_acknowledged=true
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4032
        - JIJU_VALIDATION_4221
        - JIJU_QUOTA_4291
        - JIJU_CONFLICT_4091
        - JIJU_MODERATION_4091
        - JIJU_MODERATION_4092
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: post.publish
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the same key for retries of the same publish intent; create a new key after the user materially changes the content
      x-side-effects:
        - create Post and immutable first content version
        - consume one successful POST_DAILY quota unit
        - a CONFIRM result first creates a short-lived challenge without creating a post
        - a confirmed retry creates a PENDING post and moderation review record
      x-view-count:
        returned: false
        rule: create-post response must never serialize view_count
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPostRequest'
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /posts/{post_id}:
    get:
      tags:
        - Posts
      operationId: getPostDetail
      summary: 获取帖子详情
      description: |
        鉴权要求：可选登录。游客和登录用户均可读取有效公开帖子；登录态有效且为作者时返回作者视图。
        请求参数与校验：post_id 必须为合法不透明 ID；X-View-Token 标识一次新详情页访问，同一页面刷新、回到前台或返回已打开页面时必须复用。
        响应结构：公共视图包含作者广场昵称、标签、正文、评论数量和轻互动分类数量，不返回留存结束时间；作者视图额外返回 expires_at 和 view_count。
        错误码：非作者访问到期、隐藏、删除或不存在内容统一返回 JIJU_CONTENT_4041；可选登录态失效返回 JIJU_AUTH_4012；其他错误引用 docs/errors.md。
        幂等要求：GET 不需要 Idempotency-Key；X-View-Token 用于浏览量去重。
        副作用：非作者成功打开新详情页且 view_token 首次出现时创建 A 条 ViewRecord；作者访问、失败访问、内容不可用和巡检不计数。
        浏览量：仅 is_author=true 时返回 view_count；游客和登录非作者响应必须完全省略该字段。
      x-auth:
        authentication: optional
        roles: [GUEST, AUTH_NON_AUTHOR, AUTHOR, OPERATOR]
      x-validation:
        - post_id must be a valid opaque ID
        - X-View-Token must be v1:<uuid_v7> and must be stable for one open detail page
        - expired, hidden and deleted content is unavailable to non-authors
      x-errors:
        - JIJU_AUTH_4012
        - JIJU_CONTENT_4041
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: false
        header: null
        rule: X-View-Token deduplicates view recording; it is not an Idempotency-Key
      x-side-effects:
        - create at most one ViewRecord per post_id and X-View-Token for a countable non-author view
        - increment view count by at most one for that new detail open
        - do not change comment or reaction counts
      x-view-count:
        returned: conditional
        condition: caller is the post author
        rule: only the author detail response may contain view_count
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/ViewToken'
      responses:
        '200':
          description: 帖子详情；view_count 仅在作者视图出现
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PostDetailPublicResponse'
                  - $ref: '#/components/schemas/PostDetailAuthorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      tags:
        - Posts
      operationId: editPost
      summary: 编辑本人帖子
      description: |
        鉴权要求：必须登录且为帖子作者；其他用户统一禁止。
        请求参数与校验：正文可选但修改后须为 1 至 500 个扩展字素簇；标签可选并须为对应分类当前启用 Tag ID；expected_content_version 必须匹配当前版本；高风险编辑必须完成风险确认。
        响应结构：返回帖子 ID、新内容版本、公开状态、审核状态、编辑时间和固定到期时间。
        错误码：引用 docs/errors.md；包括未登录、登录失效、权限不足、内容不可用、内容校验失败、状态/版本冲突、审核写入拒绝和系统错误。
        幂等要求：必须携带 Idempotency-Key，值为 v1:post.edit:<uuid_v7>；同一编辑意图重试复用同一键。
        副作用：生成不可变内容版本并更新展示内容；不改 ID、published_at、expires_at；高风险编辑把审核状态置为 PENDING 并新建复核记录；刷新编辑时间。
        浏览量：不返回 view_count。
      x-auth:
        authentication: user
        roles: [AUTHOR]
      x-validation:
        - expected_content_version must be a positive integer matching current_content_version
        - body_text, when present, must be 1 to 500 Unicode extended grapheme clusters after trimming
        - tag ids must be active and belong to their declared category
        - at least one editable field must be present
        - high-risk edits require risk_acknowledged=true
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_VALIDATION_4221
        - JIJU_CONFLICT_4091
        - JIJU_CONFLICT_4092
        - JIJU_MODERATION_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: post.edit
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries of the same edit payload
      x-side-effects:
        - create immutable PostVersion and increment current_content_version
        - update edited_at without changing published_at or expires_at
        - high-risk edit changes moderation_status from PASSED to PENDING and opens a new review round
        - do not refund or consume posting quota
      x-view-count:
        returned: false
        rule: edit response must never serialize view_count
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPostRequest'
      responses:
        '200':
          description: 编辑成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Posts
      operationId: deletePost
      summary: 删除本人帖子
      description: |
        鉴权要求：必须登录且为帖子作者。
        请求参数与校验：post_id 合法且当前作者可删除；服务端重新校验当前状态和内容版本。
        响应结构：成功返回 204，无响应体。
        错误码：引用 docs/errors.md；非作者、不可用内容和状态冲突分别返回稳定错误码，但不得向非作者泄露对象存在性。
        幂等要求：必须携带 Idempotency-Key，值为 v1:post.delete:<uuid_v7>；同一删除意图重试不得重复产生副作用。
        副作用：public_status 变为 DELETED、写入 deleted_at；立即从所有用户端移除；不返还发帖配额。
        浏览量：不返回 view_count。
      x-auth:
        authentication: user
        roles: [AUTHOR]
      x-validation:
        - caller must be the author
        - target must currently be eligible for author deletion
        - server must re-read current state before transition
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_CONFLICT_4091
        - JIJU_CONFLICT_4092
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: post.delete
        format: 'v1:<operation>:<uuid_v7>'
        rule: retries of the same delete intent reuse the same key
      x-side-effects:
        - set public_status to DELETED and write deleted_at
        - remove the post from public and author-visible lists
        - retain audit and report associations according to approved retention rules
        - do not refund posting quota
      x-view-count:
        returned: false
        rule: no response body
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tags:
    get:
      tags:
        - Posts
      operationId: listTags
      summary: 获取启用的标签
      description: |
        鉴权要求：无需登录；游客、登录用户和运营均按公开数据读取。
        请求参数与校验：无业务参数；只返回 enabled=true 的标签。
        响应结构：返回标签目录版本、稳定 ID、名称、分类和排序。
        错误码：系统暂时不可用或客户端网络失败，引用 docs/errors.md。
        幂等要求：GET 只读，不需要 Idempotency-Key。
        副作用：不改变标签、内容、计数、配额或审核状态。
        浏览量：不返回 view_count。
      x-auth:
        authentication: none
        roles: [GUEST, AUTH_NON_AUTHOR, AUTHOR, OPERATOR]
      x-validation:
        - no request body
        - only enabled tags are returned
        - tags are sorted by category and sort_order
      x-errors:
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: false
        header: null
        rule: read-only request
      x-side-effects:
        - none
      x-view-count:
        returned: false
        rule: tag catalog must never serialize view_count
      security: []
      responses:
        '200':
          description: 当前启用的标签目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCatalogResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /posts/{post_id}/comments:
    get:
      tags:
        - Comments
      operationId: listComments
      summary: 获取帖子评论
      description: |
        鉴权要求：可选登录；游客可读取，登录用户会收到服务端计算的本条评论删除权限提示。
        请求参数与校验：post_id 合法；cursor 为服务端签发游标；limit 为 1 至 50。
        响应结构：按 published_at 正序的游标分页，包含评论 ID、评论者广场昵称、正文和发布时间。
        错误码：帖子到期、隐藏、删除或不存在时返回 JIJU_CONTENT_4041；其他错误引用 docs/errors.md。
        幂等要求：GET 不需要 Idempotency-Key。
        副作用：只读，不改变任何计数、配额、状态或审计。
        浏览量：不返回 view_count。
      x-auth:
        authentication: optional
        roles: [GUEST, AUTH_NON_AUTHOR, AUTHOR, OPERATOR]
      x-validation:
        - post_id must be valid and publicly available
        - cursor must be an opaque server-issued token when present
        - limit must be an integer between 1 and 50
      x-errors:
        - JIJU_CONTENT_4041
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: false
        header: null
        rule: read-only request
      x-side-effects:
        - none
      x-view-count:
        returned: false
        rule: comment responses must never serialize view_count
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 评论游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - Comments
      operationId: createComment
      summary: 提交评论
      description: |
        鉴权要求：必须登录；运营账号按普通账号规则处理。
        请求参数与校验：正文去首尾空白后为 1 至 200 个 Unicode 扩展字素簇；帖子必须有效公开；首次互动前须确认使用须知。
        响应结构：返回新评论 ID、帖子 ID、评论者广场昵称、正文和发布时间。
        错误码：引用 docs/errors.md；区分未登录、登录失效、须知未确认、内容不可用、内容状态不允许、校验失败、评论配额满、状态冲突和系统错误。
        幂等要求：必须携带 Idempotency-Key，值为 v1:comment.publish:<uuid_v7>；同一评论意图重试复用同一键。
        副作用：创建 Comment；评论数量加一；仅成功后消耗一条连续 60 分钟评论配额；必要时记录审核结果。
        浏览量：不返回 view_count。
      x-auth:
        authentication: user
        roles: [AUTH_NON_AUTHOR, AUTHOR]
        ordinary_account_only: true
      x-validation:
        - post_id must identify an effective public post
        - body_text trimmed length is 1 to 200 Unicode extended grapheme clusters
        - current notice version must be confirmed
        - consecutive 60-minute comment quota must not be exhausted
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4032
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_VALIDATION_4221
        - JIJU_QUOTA_4292
        - JIJU_CONFLICT_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: comment.publish
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries of the same comment payload
      x-side-effects:
        - create Comment
        - increment comment count by one
        - consume one successful COMMENT_ROLLING_60M quota unit only after success
        - create moderation result when required
      x-view-count:
        returned: false
        rule: comment response must never serialize view_count
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
