  /admin/content/{target_type}/{target_id}/reviews:
    post:
      tags:
        - Admin
      operationId: reviewContent
      summary: 内容复核
      description: |
        鉴权要求：独立后台身份，需 CONTENT_MODERATOR 角色。
        请求参数与校验：target_type 为 POST 或 COMMENT；target_id 合法；expected_content_version 必须对应当前待审版本，或对应一条待处理举报保存的内容版本；decision 为 PASSED 或 REJECTED；reason 非空。
        响应结构：返回复核记录，包括内容版本、复核轮次、结论、处理人员、处理时间及前后状态。
        错误码：引用 docs/errors.md；权限不足、内容不可用、状态冲突、版本冲突和审核写入错误必须区分。
        幂等要求：必须携带 Idempotency-Key，值为 v1:admin.review:<uuid_v7>；同一复核结论重试复用同一键。
        副作用：常规内容复核执行 PENDING->PASSED 或 PENDING->REJECTED，REJECTED 时当前公开内容同步为 HIDDEN；举报复核按举报保存的内容版本结案，即使目标已删除、已编辑到新版本或审核状态已变化，也不得修改当前新版本或已删除内容；关联待处理举报更新为 RESOLVED；写入 ModerationRecord 和 AuditLog。
        浏览量：不返回 view_count。
      x-auth:
        authentication: admin
        roles: [CONTENT_MODERATOR]
      x-validation:
        - target_type must be POST or COMMENT
        - expected_content_version must match the current review target or a pending report content version
        - decision must be PASSED or REJECTED
        - reason must be non-empty
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_VALIDATION_4221
        - JIJU_CONFLICT_4091
        - JIJU_CONFLICT_4092
        - JIJU_MODERATION_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: admin.review
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries of the same review decision and content version
      x-side-effects:
        - transition current moderation status according to state-machine.md when reviewing the current target
        - REJECTED forces current public status to HIDDEN
        - resolve pending reports by their stored content version without mutating a deleted or newer content version
        - append ModerationRecord and AuditLog
      x-view-count:
        returned: false
        rule: content review response must never serialize view_count
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TargetType'
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewContentRequest'
      responses:
        '200':
          description: 复核完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/content/{target_type}/{target_id}/actions:
    post:
      tags:
        - Admin
      operationId: applyContentAction
      summary: 隐藏、下架或恢复内容
      description: |
        鉴权要求：独立后台身份，需 CONTENT_MODERATOR 角色。
        请求参数与校验：action 为 HIDE、TAKEDOWN 或 RESTORE；expected_content_version 必须匹配；reason 非空；RESTORE 要求后台角色、当前状态 HIDDEN、未到期、未删除、审核状态非 REJECTED。
        响应结构：返回治理动作结果、处理时间及公开/审核状态前后值。
        错误码：引用 docs/errors.md；权限不足、内容不可用、状态冲突和审核写入错误必须区分。
        幂等要求：必须携带 Idempotency-Key，值为 v1:admin.content.action:<uuid_v7>；同一治理意图重试复用同一键。
        副作用：HIDE/TAKEDOWN 使内容不可公开；RESTORE 将 HIDDEN 恢复为 PUBLISHED，但不延长 expires_at；写入 ModerationRecord 和 AuditLog。
        浏览量：不返回 view_count。

        已到期、DELETED 或审核状态 REJECTED 的内容不得 RESTORE。恢复后仍按原 expires_at 执行公开过滤，禁止延长到期时间。
      x-auth:
        authentication: admin
        roles: [CONTENT_MODERATOR]
      x-validation:
        - action must be HIDE, TAKEDOWN or RESTORE
        - expected_content_version must be positive and match the target
        - reason must be non-empty
        - RESTORE requires operator role, HIDDEN public status, server_now < expires_at and moderation status other than REJECTED
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_VALIDATION_4221
        - JIJU_CONFLICT_4091
        - JIJU_CONFLICT_4092
        - JIJU_MODERATION_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: admin.content.action
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries of the same action, target version and reason
      x-side-effects:
        - HIDE and TAKEDOWN make the target unavailable to ordinary users
        - RESTORE changes HIDDEN to PUBLISHED without changing expires_at
        - append ModerationRecord and AuditLog with before and after states
        - do not expose view_count
      x-view-count:
        returned: false
        rule: content action response must never serialize view_count
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TargetType'
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentActionRequest'
      responses:
        '200':
          description: 治理动作完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users:
    get:
      tags:
        - Admin
      operationId: listAdminUsers
      summary: 查询后台用户列表
      description: |
        鉴权要求：独立后台身份，需 ACCOUNT_MODERATOR 或 AUDITOR 角色。
        请求参数与校验：status 可为 ALL、ACTIVE、RESTRICTED、DEACTIVATED、BANNED、DELETED；query 搜索广场昵称或用户 ID；cursor 和 limit 为游标分页参数。
        响应结构：返回用户 ID、广场昵称、账号状态、当前限制到期时间、未删除帖子数、未删除评论数和加入时间；不返回微信身份、登录凭据、会话或浏览历史。
        ACTIVE 表示账号正常且无进行中的能力限制；RESTRICTED 表示账号正常但至少存在一项尚未到期的发帖、评论或互动限制。
        错误码：引用 docs/errors.md；未登录、后台权限不足、参数校验失败和系统错误必须区分。
        幂等要求：GET 只读，不需要 Idempotency-Key。
        副作用：不改变用户、内容、限制或审计状态。
        浏览量：不返回 view_count。
      x-auth:
        authentication: admin
        roles: [ACCOUNT_MODERATOR, AUDITOR]
      x-validation:
        - status must be ALL, ACTIVE, RESTRICTED, DEACTIVATED, BANNED or DELETED
        - query must not exceed 100 characters
        - cursor must be an opaque server-issued cursor
        - limit must be between 1 and 50
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_VALIDATION_4221
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: false
        header: null
        rule: read-only request
      x-side-effects:
        - none
      x-view-count:
        returned: false
        rule: admin user list must never serialize view_count, viewer identity or authentication subject data
      security:
        - adminBearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, ACTIVE, RESTRICTED, DEACTIVATED, BANNED, DELETED]
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 后台用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users/{user_id}/restrictions:
    post:
      tags:
        - Admin
      operationId: restrictAccount
      summary: 限制账号
      description: |
        鉴权要求：独立后台身份，需 ACCOUNT_MODERATOR 角色。
        请求参数与校验：user_id 合法；action 为 WARNING、POST_LIMIT、COMMENT_LIMIT、REACTION_LIMIT 或 BAN；限制类动作需提供未来 expires_at，BAN 可使用空 expires_at 表示持续封禁；reason 非空。
        响应结构：返回限制 ID、账号 ID、动作、生效时间、结束时间和当前状态。
        错误码：引用 docs/errors.md；权限不足、参数校验失败、状态冲突和系统错误必须区分。
        幂等要求：必须携带 Idempotency-Key，值为 v1:admin.user.restrict:<uuid_v7>；同一治理意图重试复用同一键。
        副作用：警告写入审计；限制类动作更新账号限制时间；BAN 更新账号状态；写入 AuditLog；不删除内容。
        浏览量：不返回 view_count。
      x-auth:
        authentication: admin
        roles: [ACCOUNT_MODERATOR]
      x-validation:
        - action must be WARNING, POST_LIMIT, COMMENT_LIMIT, REACTION_LIMIT or BAN
        - expires_at must be RFC 3339 UTC and in the future for limited actions
        - reason must be non-empty
        - user_id must identify an existing account
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_VALIDATION_4221
        - JIJU_CONFLICT_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: admin.user.restrict
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries of the same account restriction intent
      x-side-effects:
        - WARNING creates an audit record only
        - POST_LIMIT, COMMENT_LIMIT and REACTION_LIMIT update matching restriction timestamps
        - BAN updates account status
        - append AuditLog with operator, role, reason, time and state changes
        - do not alter or delete authored content
      x-view-count:
        returned: false
        rule: account restriction response must never serialize view_count
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRestrictionRequest'
      responses:
        '200':
          description: 账号处置完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRestrictionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/audit-logs:
    get:
      tags:
        - Admin
      operationId: listAuditLogs
      summary: 查询审计日志
      description: |
        鉴权要求：独立后台身份，需 AUDITOR 或具有审计范围的 CONTENT_MODERATOR 角色。
        请求参数与校验：cursor、limit、actor_id、action_type、object_type、object_id、from、to 为可选筛选；时间使用 RFC 3339 UTC。
        响应结构：返回操作者角色、动作、对象类型、对象 ID、内容版本、原因和时间，不返回内容正文或浏览者身份。
        错误码：引用 docs/errors.md；权限不足、参数校验失败和系统错误必须区分。
        幂等要求：GET 不需要 Idempotency-Key。
        副作用：只读；可记录一次后台敏感查询审计，不改变目标业务数据。
        浏览量：不返回 view_count。
      x-auth:
        authentication: admin
        roles: [AUDITOR, CONTENT_MODERATOR]
      x-validation:
        - limit must be an integer between 1 and 50
        - from and to must be RFC 3339 UTC timestamps
        - from must not be later than to
        - filters must use documented admin enums
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_ACCESS_4031
        - JIJU_VALIDATION_4221
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: false
        header: null
        rule: read-only request
      x-side-effects:
        - none to target business data
        - optional access audit record for the sensitive audit query
      x-view-count:
        returned: false
        rule: audit query must not serialize view_count
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: actor_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: action_type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: object_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditObjectType'
        - name: object_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UtcTimestamp'
        - name: to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UtcTimestamp'
      responses:
        '200':
          description: 审计日志游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 普通用户访问令牌
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 独立运营后台访问令牌；发行流程不在本次 MVP API 范围内

  parameters:
    OpaqueId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    TargetType:
      name: target_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContentTargetType'
    TargetId:
      name: target_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 服务端签发的不可解释游标；空值表示第一页
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键，格式为 v1:<operation>:<uuid_v7>。
        同一用户意图的重试必须复用同一键；载荷或业务意图变化时必须生成新键。
      schema:
        type: string
        pattern: '^v1:[a-z][a-z0-9_.-]+:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ViewToken:
      name: X-View-Token
      in: header
      required: true
      description: |
        单次新详情页访问标识，格式为 v1:<uuid_v7>。
        页面刷新、回到前台、返回已打开详情页时复用；重新进入一个新的详情页时生成新值。
      schema:
        type: string
        pattern: '^v1:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

  responses:
    Unauthorized:
      description: 未登录或登录失效，返回 JIJU_AUTH_4011 或 JIJU_AUTH_4012
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 权限不足、使用须知未确认或审核状态写入被拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 内容不可用；非作者场景不区分不存在、到期、隐藏和删除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 状态冲突、版本冲突、幂等载荷冲突或需确认风险提示
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 请求字段或内容校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 发帖或评论配额满
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 服务暂时不可用；客户端同时处理本地 NETWORK_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    OpaqueId:
      type: string
      description: 服务端生成的不透明资源 ID
      pattern: '^[a-z]{3,8}_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: pst_0190d6f4-7f92-7e60-a53d-2e7fc98e5bd1
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC 时间，以 Z 结尾
      example: '2026-11-13T10:00:00Z'
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
        has_more:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 稳定业务错误码，引用 docs/errors.md
          example: JIJU_CONTENT_4041
        message:
          type: string
          description: 用户可见安全文案
          example: 内容已不可用
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 仅允许白名单字段；不得包含正文、评论、举报说明或内部状态
    PostPublicStatus:
      type: string
      enum: [PUBLISHED, HIDDEN, EXPIRED, DELETED]
    ModerationStatus:
      type: string
      enum: [PASSED, PENDING, REJECTED]
    ReactionType:
      type: string
      enum: [HUG, HEAD_PAT, CHEER]
      description: 抱一抱、摸摸头、握拳鼓励
    ContentTargetType:
      type: string
      enum: [POST, COMMENT]
    ReportReason:
      type: string
      enum:
        - ABUSE
        - PRIVACY
        - MINOR_INVOLVED
        - DANGEROUS_OR_INAPPROPRIATE
        - SPAM
        - OTHER
    ReportStatus:
      type: string
      enum: [PENDING, PROCESSING, RESOLVED]
    ReportPriority:
      type: string
      enum: [PREEMPTIVE, NORMAL]
    ModerationPriority:
      type: string
      enum: [PREEMPTIVE, NORMAL]
    ReviewQueueItem:
      type: object
      additionalProperties: false
      required:
        - source
        - item_id
        - target_type
        - target_id
        - content_version
        - priority
        - status
        - is_minor_related
        - queue_at
      properties:
        source:
          type: string
          enum: [moderation, report]
        item_id:
          $ref: '#/components/schemas/OpaqueId'
        target_type:
          $ref: '#/components/schemas/ContentTargetType'
        target_id:
          $ref: '#/components/schemas/OpaqueId'
        content_version:
          type: integer
          minimum: 1
        priority:
          $ref: '#/components/schemas/ModerationPriority'
        status:
          type: string
        reason_code:
          type: string
          nullable: true
        hit_rule_refs:
          type: array
          nullable: true
          items:
            type: string
        is_minor_related:
          type: boolean
        queue_at:
          $ref: '#/components/schemas/UtcTimestamp'
    ReviewQueueResponse:
      type: object
      additionalProperties: false
      required: [data, page, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        page:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          type: string
    AuditObjectType:
      type: string
      enum:
        - CONTENT
        - REPORT
        - ACCOUNT
        - MODERATION_RULE
        - TAG
        - RATE_LIMIT
        - CRISIS_RESOURCE
    TagRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
    TagCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, category, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        category:
          type: string
          enum: [EMOTION, CONTEXT]
        sort_order:
          type: integer
    TagCatalogResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [version, items]
          properties:
            version:
              type: string
            items:
              type: array
              items:
                $ref: '#/components/schemas/TagCatalogItem'
        request_id:
          type: string
    ReactionCounts:
      type: object
      additionalProperties: false
      required: [hug, head_pat, cheer, total]
      properties:
        hug:
          type: integer
          minimum: 0
        head_pat:
          type: integer
          minimum: 0
        cheer:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    FeedItem:
      type: object
      additionalProperties: false
      required:
        - id
        - content_version
        - author_nickname
        - body_excerpt
        - published_at
        - comment_count
        - reaction_counts
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        content_version:
          type: integer
          minimum: 1
          description: 当前内容版本，供作者编辑时提交 expected_content_version
        author_nickname:
          type: string
        emotion_tag:
          allOf:
            - $ref: '#/components/schemas/TagRef'
          nullable: true
        context_tag:
          allOf:
            - $ref: '#/components/schemas/TagRef'
          nullable: true
        body_excerpt:
          type: string
        published_at:
          $ref: '#/components/schemas/UtcTimestamp'
        comment_count:
          type: integer
          minimum: 0
        reaction_counts:
          $ref: '#/components/schemas/ReactionCounts'
    FeedResponse:
      type: object
      additionalProperties: false
      required: [data, page, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        page:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          type: string
    PostDetailBase:
      type: object
      required:
        - id
        - content_version
        - author_nickname
        - body_text
        - published_at
        - comment_count
        - reaction_counts
        - is_author
        - my_reaction
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        content_version:
          type: integer
          minimum: 1
        author_nickname:
          type: string
        emotion_tag:
          allOf:
            - $ref: '#/components/schemas/TagRef'
          nullable: true
        context_tag:
          allOf:
            - $ref: '#/components/schemas/TagRef'
          nullable: true
        body_text:
          type: string
        published_at:
          $ref: '#/components/schemas/UtcTimestamp'
        comment_count:
          type: integer
          minimum: 0
        reaction_counts:
          $ref: '#/components/schemas/ReactionCounts'
        is_author:
          type: boolean
        my_reaction:
          allOf:
            - $ref: '#/components/schemas/ReactionType'
          nullable: true
    PostDetailPublicResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/PostDetailBase'
            - type: object
              properties:
                is_author:
                  type: boolean
                  enum: [false]
        request_id:
          type: string
    PostDetailAuthorResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/PostDetailBase'
            - type: object
              required: [is_author, view_count, expires_at]
              properties:
                is_author:
                  type: boolean
                  enum: [true]
                view_count:
                  type: integer
                  minimum: 0
                expires_at:
                  $ref: '#/components/schemas/UtcTimestamp'
                  description: 仅作者详情返回留存结束时间
        request_id:
          type: string
    PublishPostRequest:
      type: object
      additionalProperties: false
      required: [body_text, retention_hours]
      properties:
        body_text:
          type: string
          minLength: 1
          maxLength: 500
          description: 去首尾空白后按 Unicode 扩展字素簇计数，必须为 1 至 500
        emotion_tag_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          nullable: true
        context_tag_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          nullable: true
        retention_hours:
          type: integer
          enum: [24, 72, 168]
          description: 必填；客户端可默认预选 168，但必须显式提交
        risk_acknowledged:
          type: boolean
          default: false
          description: 仅在高风险提示已向用户展示并获得确认后设为 true
        risk_challenge_id:
          type: string
          description: CONFIRM 分支首次响应返回的短期 challenge_id；确认后重试时必填
    EditPostRequest:
      type: object
      additionalProperties: false
      required: [expected_content_version]
      minProperties: 1
      properties:
        expected_content_version:
          type: integer
          minimum: 1
        body_text:
          type: string
          minLength: 1
          maxLength: 500
          description: 去首尾空白后按 Unicode 扩展字素簇计数，必须为 1 至 500
        emotion_tag_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          nullable: true
        context_tag_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          nullable: true
        risk_acknowledged:
          type: boolean
          default: false
    PostMutationResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - id
            - content_version
            - public_status
            - moderation_status
            - published_at
            - expires_at
          properties:
            id:
              $ref: '#/components/schemas/OpaqueId'
            content_version:
              type: integer
              minimum: 1
            public_status:
              $ref: '#/components/schemas/PostPublicStatus'
            moderation_status:
