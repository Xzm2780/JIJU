        - counts must never become negative
      x-errors:
        - JIJU_AUTH_4011
        - JIJU_AUTH_4012
        - JIJU_CONTENT_4041
        - JIJU_CONTENT_4221
        - JIJU_CONFLICT_4091
        - JIJU_SYSTEM_5031
        - NETWORK_ERROR
      x-error-reference: docs/errors.md
      x-idempotency:
        required: true
        header: Idempotency-Key
        operation: reaction.cancel
        format: 'v1:<operation>:<uuid_v7>'
        rule: reuse the key for retries of the same cancellation intent
      x-side-effects:
