        幂等要求：必须携带 Idempotency-Key，值为 v1:reaction.cancel:<uuid_v7>；同一取消意图重试复用同一键。
        副作用：若存在有效互动则置 active=false 并对应类型减一；重复取消保持幂等且不得产生负数；不消耗配额。
